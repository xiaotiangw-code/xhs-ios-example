# =============================================
#  Unified config: all mutable / sensitive params live here.
#  Loaded ONCE by common.Config, shared by every example.
#  NOTE: keep this file ASCII-only (comments in English) so it
#  renders correctly in ANY editor regardless of encoding.
#  Values you fill in MAY be Chinese (loaded as UTF-8).
# =============================================

# ---- Platform account (sign-app backend account, gets Bearer token) ----
platform.username=test
platform.password=Test@123456
platform.machineCode=m-10001

# ---- Xiaohongshu account (example 2 password login / example 3 sms login) ----
# Lives as constants inside passwordLogin / smsCodeLogin example classes.

# ---- Outbound proxy (required when sign-app proxy-free=false) ----
# Format: socks5://user:pass@host:port  (empty = direct connect)
proxy=socks5://username:password@8.3.176.54:14220

# ---- Device (registered uniqueId; example 5 / 8 auto-creates one) ----
# Lives as constants inside the login-type example classes.

# ---- Backend base URL (sign-app root) ----
backend.base=http://127.0.0.1:8081

# NOTE: business-specific params (note id / room id / comment content etc.)
# are NOT here - they live as constants inside each example class.
